name: Compatibility report
description: Tell us where the server works, or not (TopSolid version, modules, OS, AI client)
title: "[compat] "
labels: [compatibility]
body:
  - type: input
    id: mcp
    attributes:
      label: TopSolid MCP version
      placeholder: "1.8.18"
    validations:
      required: true
  - type: input
    id: topsolid
    attributes:
      label: TopSolid version and build
      description: Shown by topsolid_get_state. Example, 7.21.304.
    validations:
      required: true
  - type: input
    id: modules
    attributes:
      label: Modules
      description: The "Modules" line of topsolid_get_state (Design, Drafting...), and TopSolid'Steel, Wood, Cam if you use them.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
  - type: input
    id: client
    attributes:
      label: AI client and transport
      placeholder: Claude Desktop over HTTP
  - type: dropdown
    id: status
    attributes:
      label: Result
      options:
        - Everything I tried works
        - Works, with problems (details below)
        - Does not connect or crashes
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you tried and what happened
